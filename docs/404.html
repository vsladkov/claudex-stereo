<!doctype html>
<html lang="en">
  <head>

    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#f7f4ee" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#131109" media="(prefers-color-scheme: dark)" />
    <title>Signal lost — Claudex Stereo</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f7f4ee;
        --surface: #fffefb;
        --hairline: rgba(62, 49, 30, 0.16);
        --ink: #211d16;
        --muted: #6f6759;
        --claude: #d97a1f;
        --codex: #3aa8bd;
        --signal: linear-gradient(90deg, var(--claude), var(--codex));
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #131109;
          --surface: #1b1810;
          --hairline: rgba(242, 238, 230, 0.12);
          --ink: #f2eee6;
          --muted: #b8afa2;
          --claude: #e8a33d;
          --codex: #3fc1d4;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        display: grid;
        min-height: 100vh;
        min-height: 100svh;
        margin: 0;
        padding: 1rem;
        place-items: center;
        background:
          radial-gradient(
            circle at 20% 10%,
            color-mix(in srgb, var(--claude) 14%, transparent),
            transparent 25rem
          ),
          radial-gradient(
            circle at 80% 90%,
            color-mix(in srgb, var(--codex) 14%, transparent),
            transparent 25rem
          ),
          var(--bg);
        color: var(--ink);
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          sans-serif;
      }
      main {
        width: min(34rem, 100%);
        padding: clamp(1.5rem, 7vw, 3.5rem);
        border: 1px solid var(--hairline);
        border-radius: 1.25rem;
        background: var(--surface);
        box-shadow:
          0 20px 60px rgba(0, 0, 0, 0.2),
          inset 0 1px 0 rgba(255, 255, 255, 0.04);
      }
      svg {
        display: block;
        margin-bottom: 2rem;
      }
      p {
        color: var(--muted);
        line-height: 1.7;
      }
      .code,
      h1,
      a {
        font-family: ui-monospace, 'SF Mono', Consolas, monospace;
      }
      .code {
        margin: 0 0 0.5rem;
        color: var(--codex);
        font-size: 0.75rem;
      }
      h1 {
        margin: 0;
        font-size: clamp(2rem, 9vw, 3.5rem);
        letter-spacing: -0.06em;
      }
      nav {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
        margin-top: 1.5rem;
      }
      a {
        padding: 0.55rem 0.8rem;
        border: 1px solid var(--hairline);
        border-radius: 999px;
        color: var(--ink);
        text-decoration: none;
      }
      a:first-child {
        border-color: transparent;
        background: var(--signal);
        color: #080706;
        font-weight: 700;
      }
      :focus-visible {
        outline: 2px solid var(--codex);
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <svg width="32" height="32" viewBox="0 0 32 32" aria-hidden="true">
        <rect x="4" y="9" width="4.6" height="14" rx="2.3" fill="var(--claude)" />
        <rect x="10.4" y="5" width="4.6" height="22" rx="2.3" fill="var(--claude)" />
        <rect x="16.8" y="11" width="4.6" height="10" rx="2.3" fill="var(--codex)" />
        <rect x="23.2" y="7" width="4.6" height="18" rx="2.3" fill="var(--codex)" />
      </svg>
      <p class="code">404 / channel unavailable</p>
      <h1>Signal lost.</h1>
      <p>
        The route you followed is not on this channel. Return to the main signal or inspect the
        repository.
      </p>
      <nav aria-label="Recovery links">
        <a href="/">Back home</a>
        <a href="https://github.com/vsladkov/claudex-stereo">GitHub ↗</a>
      </nav>
    </main>
  </body>
</html>
