name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CODEX_CLI_VERSION: 0.146.0

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache Codex CLI install
        id: codex-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.codex-cli-prefix
          key: codex-cli-${{ env.CODEX_CLI_VERSION }}-${{ runner.os }}

      - name: Install Codex CLI
        if: steps.codex-cache.outputs.cache-hit != 'true'
        run: npm install -g --prefix "$HOME/.codex-cli-prefix" "@openai/codex@$CODEX_CLI_VERSION"

      - name: Add Codex CLI to PATH
        run: echo "$HOME/.codex-cli-prefix/bin" >> "$GITHUB_PATH"

      - name: Check version metadata
        run: npm run check-version

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Run test suite
        run: npm test

      - name: Run build
        run: npm run build

  windows:
    name: Windows
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run portable test suite
        run: npm run test:windows

      - name: Install Codex CLI
        run: npm install -g "@openai/codex@$env:CODEX_CLI_VERSION"

      - name: Run build
        run: npm run build
